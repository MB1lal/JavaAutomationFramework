version: 2.1
#orbs:
#  browser-tools: circleci/browser-tools@1.4.6

jobs:
  test-and-report:
    docker:
      - image: mb1lal/java-test:java21
    steps:
      - checkout
      - run:
          name: Test
          command: mvn clean -ntp verify -Dfailsafe.rerunFailingTestsCount=2

      - store_test_results:
          path: target/cucumber-report/

      - run:
          name: Compress Artifacts
          command: tar -cvzf myartifact.tar target/site/serenity

      - store_artifacts:
          path: myartifact.tar
          destination: AutomationPractice

workflows:
  AllTests:
    jobs:
      - test-and-report
